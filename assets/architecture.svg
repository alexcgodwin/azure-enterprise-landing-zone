<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="1280" height="720" rx="28" fill="#07111F"/><rect x="38" y="40" width="1204" height="640" rx="24" fill="#0B1E34" stroke="#23577E"/><text x="72" y="92" fill="#FFFFFF" font-family="Segoe UI, Arial" font-size="34" font-weight="700">Azure Enterprise Landing Zone</text><text x="72" y="122" fill="#8EA7BC" font-family="Segoe UI, Arial" font-size="16">Governed application platform with network, identity, AKS, registry, secrets, observability and policy controls.</text><g font-family="Segoe UI, Arial"><rect x="70" y="170" width="220" height="90" rx="14" fill="#102A43" stroke="#2D6D99"/><text x="95" y="205" fill="#83D2FF" font-size="14" font-weight="700">GitHub Actions</text><text x="95" y="232" fill="#D8E6F2" font-size="16">Plan, validate, evidence</text><rect x="350" y="170" width="220" height="90" rx="14" fill="#102A43" stroke="#2D6D99"/><text x="375" y="205" fill="#83D2FF" font-size="14" font-weight="700">OIDC Trust</text><text x="375" y="232" fill="#D8E6F2" font-size="16">No long-lived deploy key</text><rect x="630" y="170" width="250" height="90" rx="14" fill="#102A43" stroke="#2D6D99"/><text x="655" y="205" fill="#83D2FF" font-size="14" font-weight="700">Terraform Boundary</text><text x="655" y="232" fill="#D8E6F2" font-size="16">Repeatable source of truth</text><rect x="955" y="170" width="220" height="90" rx="14" fill="#102A43" stroke="#2D6D99"/><text x="980" y="205" fill="#83D2FF" font-size="14" font-weight="700">Azure Subscription</text><text x="980" y="232" fill="#D8E6F2" font-size="16">Isolated project scope</text><path d="M290 215H350M570 215H630M880 215H955" stroke="#75D5FF" stroke-width="3" marker-end="url(#arrow)"/><rect x="90" y="330" width="500" height="210" rx="18" fill="#091827" stroke="#23577E"/><text x="120" y="370" fill="#FFFFFF" font-size="24" font-weight="700">Network and Runtime</text><text x="120" y="410" fill="#AEBFCF" font-size="16">Hub and spoke virtual networks</text><text x="120" y="440" fill="#AEBFCF" font-size="16">AKS private workload subnet</text><text x="120" y="470" fill="#AEBFCF" font-size="16">ACR image supply path</text><text x="120" y="500" fill="#AEBFCF" font-size="16">Autoscaling and diagnostic settings</text><rect x="690" y="330" width="500" height="210" rx="18" fill="#091827" stroke="#23577E"/><text x="720" y="370" fill="#FFFFFF" font-size="24" font-weight="700">Security and Operations</text><text x="720" y="410" fill="#AEBFCF" font-size="16">Entra RBAC and workload identity</text><text x="720" y="440" fill="#AEBFCF" font-size="16">Key Vault secret boundary</text><text x="720" y="470" fill="#AEBFCF" font-size="16">Azure Policy for guardrails</text><text x="720" y="500" fill="#AEBFCF" font-size="16">Log Analytics operational evidence</text><text x="72" y="620" fill="#607B91" font-size="14">Validated live, documented, then destroyed through Terraform to keep cost exposure controlled.</text></g><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#75D5FF"/></marker></defs></svg>